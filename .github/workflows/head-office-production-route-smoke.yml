name: Head Office Production Route Smoke

on:
  pull_request:
    paths:
      - '.github/workflows/head-office-production-route-smoke.yml'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  production-routes:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose production domain and Pages binding
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set +e
          report="## Production domain + Pages binding diagnostics"$'\n'
          report+="### HTTP"$'\n'
          urls=(
            "https://mytree.cc/head-office"
            "https://mytree.cc/head-office/communities"
            "https://www.mytree.cc/head-office"
            "https://local-menu-hub.pages.dev/head-office"
            "https://local-menu-hub.pages.dev/head-office/communities"
            "https://911bc276.local-menu-hub.pages.dev/head-office"
            "https://911bc276.local-menu-hub.pages.dev/head-office/communities"
          )
          for url in "${urls[@]}"; do
            key="$(echo "$url" | tr '/:.' '_' | tr -cd '[:alnum:]_')"
            body="/tmp/${key}.html"
            headers="/tmp/${key}.headers"
            err="/tmp/${key}.err"
            code="$(curl -sS -L --max-time 30 -D "$headers" -o "$body" -w '%{http_code}' "$url" 2>"$err")"
            curl_status=$?
            bytes="$(wc -c < "$body" 2>/dev/null || echo 0)"
            if grep -qi '<div id="root"' "$body" 2>/dev/null; then root=yes; else root=no; fi
            server="$(grep -i '^server:' "$headers" | tail -1 | tr -d '\r' | cut -d: -f2- | xargs)"
            report+="- \`${url}\`: exit=${curl_status}, HTTP=${code:-none}, bytes=${bytes}, root=${root}, server=\`${server:-none}\`"$'\n'
          done
          report+="### Cloudflare Pages custom-domain API"$'\n'
          if [ -z "${CF_API_TOKEN:-}" ]; then
            report+="- repository secret \`CLOUDFLARE_API_TOKEN\`: not configured/available to this workflow"$'\n'
          else
            api_body="/tmp/cf_domains.json"
            api_code="$(curl -sS --max-time 30 -o "$api_body" -w '%{http_code}'               -H "Authorization: Bearer $CF_API_TOKEN"               -H "Content-Type: application/json"               "https://api.cloudflare.com/client/v4/accounts/a2808d9640e339098e6bb8230c1b431c/pages/projects/local-menu-hub/domains")"
            summary="$(jq -c '{success,domains:[.result[]? | {name,status,verification_data}]}' "$api_body" 2>/dev/null | head -c 3000)"
            report+="- API HTTP=${api_code}; response=\`${summary:-unparseable}\`"$'\n'
          fi
          printf '%s\n' "$report"
          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body "$report"
