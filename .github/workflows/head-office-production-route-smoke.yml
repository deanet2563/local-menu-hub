name: Head Office Production Route Smoke

on:
  pull_request:
    paths:
      - '.github/workflows/head-office-production-route-smoke.yml'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  production-routes:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose production domain and Pages routes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set +e
          report="## Production domain diagnostics"$'\n'
          report+="### DNS"$'\n'
          for host in mytree.cc www.mytree.cc local-menu-hub.pages.dev; do
            a="$(dig +short A "$host" | tr '\n' ' ' | head -c 300)"
            aaaa="$(dig +short AAAA "$host" | tr '\n' ' ' | head -c 300)"
            cname="$(dig +short CNAME "$host" | tr '\n' ' ' | head -c 300)"
            report+="- \`${host}\`: A=\`${a:-none}\`, AAAA=\`${aaaa:-none}\`, CNAME=\`${cname:-none}\`"$'\n'
          done
          report+="### HTTP"$'\n'
          urls=(
            "https://mytree.cc/head-office"
            "https://mytree.cc/head-office/communities"
            "https://www.mytree.cc/head-office"
            "https://local-menu-hub.pages.dev/head-office"
            "https://local-menu-hub.pages.dev/head-office/communities"
            "https://911bc276.local-menu-hub.pages.dev/head-office"
            "https://911bc276.local-menu-hub.pages.dev/head-office/communities"
          )
          for url in "${urls[@]}"; do
            key="$(echo "$url" | tr '/:.' '_' | tr -cd '[:alnum:]_')"
            body="/tmp/${key}.html"
            headers="/tmp/${key}.headers"
            err="/tmp/${key}.err"
            code="$(curl -sS -L --max-time 30 -D "$headers" -o "$body" -w '%{http_code}' "$url" 2>"$err")"
            curl_status=$?
            bytes="$(wc -c < "$body" 2>/dev/null || echo 0)"
            if grep -qi '<div id="root"' "$body" 2>/dev/null; then root=yes; else root=no; fi
            server="$(grep -i '^server:' "$headers" | tail -1 | tr -d '\r' | cut -d: -f2- | xargs)"
            cf_ray="$(grep -i '^cf-ray:' "$headers" | tail -1 | tr -d '\r' | cut -d: -f2- | xargs)"
            err_text="$(tr '\n' ' ' < "$err" | head -c 200)"
            report+="- \`${url}\`: exit=${curl_status}, HTTP=${code:-none}, bytes=${bytes}, root=${root}, server=\`${server:-none}\`, cf-ray=\`${cf_ray:-none}\`"
            if [ -n "$err_text" ]; then report+=", error=\`${err_text}\`"; fi
            report+=$'\n'
          done
          printf '%s\n' "$report"
          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body "$report"
