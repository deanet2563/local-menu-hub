name: Customer Canonical CI

on:
  push:
    branches:
      - codex/customer-home-local-food-hub
  workflow_dispatch:

jobs:
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
