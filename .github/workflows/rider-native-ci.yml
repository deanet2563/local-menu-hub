name: Rider Native CI

on:
  pull_request:
    paths:
      - 'apps/rider-native/**'
      - '.github/workflows/rider-native-ci.yml'
  push:
    branches:
      - 'agent/rider-native-foundation'
    paths:
      - 'apps/rider-native/**'
      - '.github/workflows/rider-native-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rider-native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install base dependencies
        run: npm install

      - name: Install Expo-managed native dependencies
        run: npm run setup:native-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Expo Doctor
        run: npm run doctor

      - name: Production dependency audit
        run: npm run audit:prod

  build-test-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://ecrxrwfrwuoenjoyhfzw.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_Qvsg8XpfUurNKewoDab9Ww_D9xvweP0
      EXPO_PUBLIC_MYTREE_WORKER_URL: https://mytree-worker.kompakorn-t.workers.dev
      EXPO_PUBLIC_LINE_LOGIN_CHANNEL_ID: '2010936243'
      EXPO_PUBLIC_EAS_PROJECT_ID: '1b22c0a8-abbc-43a7-adc3-6f77c9ce0135'
      EXPO_PUBLIC_ENABLE_RIDER_DELIVERY_V3: 'true'
      EXPO_PUBLIC_ENABLE_RIDER_PUSH_REGISTRY: 'true'
    defaults:
      run:
        working-directory: apps/rider-native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Align Expo SDK dependencies
        run: npx expo install --fix

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone test APK with bundled JS
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Upload Rider test-ready APK
        uses: actions/upload-artifact@v4
        with:
          name: mytree-rider-android-test-ready
          path: apps/rider-native/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
