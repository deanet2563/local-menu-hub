name: Customer Catalog CI
on:
  pull_request:
    paths:
      - 'src/components/customer/**'
      - 'src/hooks/useCustomerCatalog.ts'
      - 'src/lib/customerPublicRoutes.ts'
      - 'src/lib/foodHubCategories.ts'
      - 'public/brand/**'
      - 'src/lib/supabase.ts'
      - 'src/lib/order.ts'
      - 'src/lib/deliveryLocation.ts'
      - 'tools/tests/order-environment.test.cjs'
      - 'tools/tests/customer-public-auth.test.cjs'
      - 'src/routes/index.tsx'
      - 'src/routes/hub/**'
      - 'tools/tests/customer-catalog.test.cjs'
      - '.github/workflows/customer-catalog-ci.yml'
  workflow_dispatch:
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.22'
      - run: bun install --frozen-lockfile
      - run: node --test tools/tests/order-environment.test.cjs tools/tests/customer-public-auth.test.cjs tools/tests/customer-catalog.test.cjs tools/tests/customer-liff-state.test.cjs tools/tests/platform-admin-session-policy.test.cjs
      - run: bun run build
