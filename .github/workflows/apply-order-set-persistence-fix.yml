name: Apply Order Set Persistence Fix

on:
  push:
    branches:
      - agent/persist-order-sets-v2

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[bot] persist order sets')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/persist-order-sets-v2
      - name: Patch shop order grouping
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/shop/OrderManagement.tsx')
          s = p.read_text()

          old = 'type Item = { item_name_snapshot: string; qty: number; line_total: number };\n'
          new = '''type Item = { item_name_snapshot: string; qty: number; line_total: number };\ntype StoredItem = {\n  item_name?: string;\n  qty?: number;\n  unit_price?: number;\n  set_id?: string | null;\n  set_name?: string | null;\n};\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '  order_items: Item[];\n};'
          new = '  items_json: StoredItem[] | null;\n  order_items: Item[];\n};'
          assert old in s
          s = s.replace(old, new, 1)

          marker = '''function shortJobId(subId: string) {\n  return subId.slice(0, 6).toUpperCase();\n}\n'''
          helper = '''function shortJobId(subId: string) {\n  return subId.slice(0, 6).toUpperCase();\n}\n\ntype ShopDisplayItem = { name: string; qty: number; total: number; setId: string | null; setName: string | null };\n\nfunction groupedOrderItems(order: Order) {\n  const source: ShopDisplayItem[] = Array.isArray(order.items_json) && order.items_json.length > 0\n    ? order.items_json.map((item, idx) => ({\n        name: item.item_name?.trim() || `รายการ ${idx + 1}`,\n        qty: Number(item.qty) || 0,\n        total: (Number(item.qty) || 0) * (Number(item.unit_price) || 0),\n        setId: item.set_id?.trim() || null,\n        setName: item.set_name?.trim() || null,\n      }))\n    : order.order_items.map((item) => ({\n        name: item.item_name_snapshot,\n        qty: Number(item.qty) || 0,\n        total: Number(item.line_total) || 0,\n        setId: null,\n        setName: null,\n      }));\n\n  const groups: Array<{ key: string; name: string; isSet: boolean; items: ShopDisplayItem[]; total: number }> = [];\n  const index = new Map<string, number>();\n  for (const item of source) {\n    const key = item.setId ? `set:${item.setId}` : item.setName ? `set-name:${item.setName}` : 'general';\n    let groupIndex = index.get(key);\n    if (groupIndex === undefined) {\n      groupIndex = groups.length;\n      index.set(key, groupIndex);\n      groups.push({ key, name: item.setName || 'รายการทั่วไป', isSet: !!item.setName, items: [], total: 0 });\n    }\n    const group = groups[groupIndex];\n    if (!group) continue;\n    group.items.push(item);\n    group.total += item.total;\n  }\n  return [...groups.filter((g) => g.isSet), ...groups.filter((g) => !g.isSet)];\n}\n'''
          assert marker in s
          s = s.replace(marker, helper, 1)

          old = '.select("sub_id,order_id,fulfillment_type,order_status,payment_status,print_status,delivery_status,delivery_address,delivery_photo_url,payment_method,payment_slip_url,customer_note,amount,assigned_rider_id,created_at,delivery_fee,delivery_fee_payer,delivery_distance_km,order_items(item_name_snapshot,qty,line_total),hub_orders(customers(name,phone))")'
          new = '.select("sub_id,order_id,fulfillment_type,order_status,payment_status,print_status,delivery_status,delivery_address,delivery_photo_url,payment_method,payment_slip_url,customer_note,amount,assigned_rider_id,created_at,delivery_fee,delivery_fee_payer,delivery_distance_km,items_json,order_items(item_name_snapshot,qty,line_total),hub_orders(customers(name,phone))")'
          assert old in s
          s = s.replace(old, new, 1)

          old = '''            <div className="text-sm text-gray-700">\n              {o.order_items.map((i, idx) => (\n                <div key={idx} className="flex justify-between">\n                  <span>{i.item_name_snapshot} × {i.qty}</span>\n                  <span className="text-gray-500">฿{i.line_total}</span>\n                </div>\n              ))}\n            </div>'''
          new = '''            <div className="space-y-2">\n              {groupedOrderItems(o).map((group) => (\n                <div key={group.key} className={group.isSet ? "rounded-lg border border-orange-100 bg-orange-50/60 p-2" : "py-1"}>\n                  {group.isSet && (\n                    <div className="mb-1 flex justify-between text-xs font-semibold text-orange-700">\n                      <span>{group.name}</span>\n                      <span>฿{group.total}</span>\n                    </div>\n                  )}\n                  <div className="space-y-0.5 text-sm text-gray-700">\n                    {group.items.map((i, idx) => (\n                      <div key={`${group.key}-${idx}`} className="flex justify-between gap-3">\n                        <span>{i.name} × {i.qty}</span>\n                        <span className="shrink-0 text-gray-500">฿{i.total}</span>\n                      </div>\n                    ))}\n                  </div>\n                </div>\n              ))}\n            </div>'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          Path('.github/workflows/apply-order-set-persistence-fix.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[bot] persist order sets in shop order UI"
          git push origin HEAD:agent/persist-order-sets-v2
