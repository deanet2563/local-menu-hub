name: AI Office CI

on:
  pull_request:
    paths:
      - 'src/routes/sweet/ai-office.tsx'
      - '.github/workflows/ai-office-ci.yml'
      - 'package.json'
      - 'tsconfig.json'
      - 'vite.config.ts'

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
