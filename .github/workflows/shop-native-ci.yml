name: Shop Native CI

on:
  pull_request:
    paths:
      - 'apps/shop-native/**'
      - '.github/workflows/shop-native-ci.yml'
  push:
    branches:
      - 'feature/shop-native-foundation'
    paths:
      - 'apps/shop-native/**'
      - '.github/workflows/shop-native-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/shop-native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Align Expo SDK dependencies
        run: npx expo install --fix

      - name: Typecheck
        run: npm run typecheck

      - name: Expo Doctor
        run: npm run doctor

      - name: Validate Android native generation
        run: npx expo prebuild --platform android --clean --no-install
