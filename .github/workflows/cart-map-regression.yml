name: Cart map regression
on:
  pull_request:
    paths:
      - 'src/components/DeliveryLocationPicker*'
      - 'src/lib/retainedMapHost.ts'
      - 'src/routes/cart.tsx'
      - 'tools/tests/cart-map/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/cart-map-regression.yml'
jobs:
  cart-map:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright install --with-deps ${{ matrix.browser }}
      - run: bun run test:cart-map
        env:
          TEST_BROWSER: ${{ matrix.browser }}
