name: Head Office RBAC Client CI

on:
  pull_request:
    paths:
      - 'src/components/admin/PlatformAdminGate.tsx'
      - 'src/components/head-office/**'
      - 'src/lib/adminAccess.ts'
      - 'src/routes/head-office/**'
      - 'src/routes/sweet/admin.tsx'
      - '.github/workflows/head-office-rbac-client-ci.yml'
      - 'package.json'
      - 'tsconfig.json'
      - 'vite.config.ts'

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
